name: "Diagnostic: Inspect Bin PDF Cell Colors"

# Temporary one-off diagnostic workflow. Inspects the Cornwall Council bin
# collection PDF's vector fills (cell shading) and text positions, to
# figure out how to programmatically tell dark-green (black bin/rubbish)
# Mondays apart from light-green (green bin/recycling) Mondays. Not meant
# to be merged to main long-term.

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Download PDF
        run: |
          curl -sS -o /tmp/bins.pdf "https://www.cornwall.gov.uk/media/rggnvze3/monfort1new.pdf" \
            -H "User-Agent: Mozilla/5.0 (compatible; ChyKernykSite/1.0; +https://chykernyk.co.uk)"
          ls -la /tmp/bins.pdf

      - name: Inspect with PyMuPDF
        run: |
          pip install --quiet pymupdf
          cat > /tmp/pdf_inspect2.py << 'PYEOF'
          import fitz
          doc = fitz.open("/tmp/bins.pdf")
          page = doc[0]
          drawings = page.get_drawings()

          GREENS = [(0.474, 0.738, 0.262), (0.0, 0.263, 0.195)]

          for target in GREENS:
              print(f"\n===== color {target} =====")
              for d in drawings:
                  fill = d.get("fill")
                  if fill is None:
                      continue
                  key = tuple(round(c, 3) for c in fill)
                  if key != target:
                      continue
                  print(f"drawing rect(bbox)={d['rect']} num_items={len(d['items'])}")
                  for it in d["items"]:
                      print("  item:", it)

          print("\n===== ALL text spans (day numbers only, digits) =====")
          d = page.get_text("dict")
          for block in d["blocks"]:
              for line in block.get("lines", []):
                  for span in line.get("spans", []):
                      txt = span["text"].strip()
                      if txt.isdigit():
                          print(repr(txt), span["bbox"])

          print("\n===== Month header + weekday header spans =====")
          d = page.get_text("dict")
          for block in d["blocks"]:
              for line in block.get("lines", []):
                  for span in line.get("spans", []):
                      txt = span["text"].strip()
                      if txt in ("Mo", "Tu", "We", "Th", "Fr") or any(m in txt for m in ["2025", "2026"]):
                          print(repr(txt), span["bbox"])
          PYEOF
          cd /tmp && python3 /tmp/pdf_inspect2.py
