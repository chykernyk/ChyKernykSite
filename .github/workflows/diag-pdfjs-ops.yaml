name: "Diagnostic: pdfjs operator list for bin PDF"

# Temporary one-off diagnostic workflow. Uses Deno + pdfjs-dist (the same
# library unpdf wraps, and what the actual bin-collection edge function
# runs on) to inspect the bin PDF's text content and low-level fill
# operators, cross-checking against ground truth already established via
# PyMuPDF on a separate runner. Not meant to be merged to main long-term.

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Fetch and inspect PDF via pdfjs-dist
        run: |
          cat > /tmp/inspect.ts << 'EOF'
          import { getDocumentProxy } from "npm:unpdf@0.12.1";
          import { OPS } from "npm:pdfjs-dist@4.7.76/legacy/build/pdf.mjs";

          const res = await fetch("https://www.cornwall.gov.uk/media/rggnvze3/monfort1new.pdf", {
            headers: { "User-Agent": "Mozilla/5.0 (compatible; ChyKernykSite/1.0; +https://chykernyk.co.uk)" },
          });
          const bytes = new Uint8Array(await res.arrayBuffer());
          const doc = await getDocumentProxy(bytes);
          const page = await doc.getPage(1);

          const opList = await page.getOperatorList();
          const opNames: Record<number, string> = {};
          for (const [name, val] of Object.entries(OPS)) opNames[val as number] = name;

          const TARGETS: Record<string, [number, number, number]> = {
            light: [121, 188, 67],
            dark: [0, 67, 50],
          };

          function colorMatch(c: any): string | null {
            for (const [label, [r, g, b]] of Object.entries(TARGETS)) {
              if (c && c[0] === r && c[1] === g && c[2] === b) return label;
            }
            return null;
          }

          let currentColor: string | null = null;
          let sinceColorSetOps = 0;
          const foundPaths: { color: string; subOps: number[]; coords: number[] }[] = [];
          const transformsSeen: any[] = [];

          for (let i = 0; i < opList.fnArray.length; i++) {
            const name = opNames[opList.fnArray[i]] ?? `unknown(${opList.fnArray[i]})`;
            const args = opList.argsArray[i];
            if (name === "setFillRGBColor") {
              currentColor = colorMatch(args);
              sinceColorSetOps = 0;
            } else if (name === "constructPath") {
              sinceColorSetOps++;
              if (currentColor && sinceColorSetOps <= 3) {
                const [subOps, coords] = args;
                // Only record "pure rectangle" paths (all subops are the same code, repeated), matching grid cells
                const allSame = subOps.every((s: number) => s === subOps[0]);
                if (allSame && subOps.length >= 1 && coords.length >= 4) {
                  foundPaths.push({ color: currentColor, subOps, coords });
                }
              }
            } else if (name === "transform") {
              if (currentColor && sinceColorSetOps <= 2) {
                transformsSeen.push({ color: currentColor, args, opIndex: i });
              }
            } else if (name === "save" || name === "restore") {
              // don't reset currentColor tracking on save/restore for this heuristic scan
            }
          }

          console.log("num foundPaths:", foundPaths.length);
          for (const fp of foundPaths) {
            console.log(`color=${fp.color} subOpsLen=${fp.subOps.length} subOp0=${fp.subOps[0]} coordsLen=${fp.coords.length}`);
            console.log("coords:", JSON.stringify(fp.coords));
          }
          console.log("transformsSeen near color-set (should reveal any wrapping cm before path):", JSON.stringify(transformsSeen).slice(0, 2000));

          // Also print OPS.rectangle numeric value for reference
          console.log("OPS.rectangle =", (OPS as any).rectangle);
          console.log("OPS.moveTo =", (OPS as any).moveTo);
          console.log("OPS.lineTo =", (OPS as any).lineTo);
          console.log("OPS.curveTo =", (OPS as any).curveTo);
          EOF
          deno run --allow-net --allow-read --allow-env /tmp/inspect.ts
