name: "Diagnostic: pdfjs operator list for bin PDF"

# Temporary one-off diagnostic workflow. Tests whether getOperatorList()
# is flaky/racy under unpdf's Deno worker shim by calling it multiple
# times (fresh page instances) in a single run and comparing results.
# Not meant to be merged to main long-term.

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Test getOperatorList repeatability
        run: |
          cat > /tmp/test.ts << 'EOF'
          import { getDocumentProxy } from "npm:unpdf@0.12.1";
          import { OPS } from "npm:pdfjs-dist@4.7.76/legacy/build/pdf.mjs";

          const res = await fetch("https://www.cornwall.gov.uk/media/rggnvze3/monfort1new.pdf", {
            headers: { "User-Agent": "Mozilla/5.0 (compatible; ChyKernykSite/1.0; +https://chykernyk.co.uk)" },
          });
          const bytes = new Uint8Array(await res.arrayBuffer());
          console.log("fetched bytes:", bytes.length);

          async function attempt(label: string, doc: any, viaFreshPage: boolean) {
            const page = viaFreshPage ? await doc.getPage(1) : doc._cachedPage ?? (doc._cachedPage = await doc.getPage(1));
            const t0 = performance.now();
            const opList = await page.getOperatorList();
            const t1 = performance.now();
            console.log(`[${label}] fnArray.length=${opList.fnArray.length} took=${(t1 - t0).toFixed(1)}ms`);
            return opList.fnArray.length;
          }

          // Attempt 1: brand new doc + page, immediately after fetch.
          const doc1 = await getDocumentProxy(new Uint8Array(bytes));
          await attempt("doc1-try1", doc1, true);

          // Attempt 2: SAME doc, fresh getPage(1) call (pdfjs usually caches by page index).
          await attempt("doc1-try2-samedoc", doc1, true);

          // Attempt 3: a completely fresh document proxy from a fresh byte copy.
          const doc2 = await getDocumentProxy(new Uint8Array(bytes));
          await attempt("doc2-try1", doc2, true);

          // Attempt 4: retry on doc2 again.
          await attempt("doc2-try2-samedoc", doc2, true);

          // Attempt 5: a small delay before calling, in case it's a timing/microtask issue.
          const doc3 = await getDocumentProxy(new Uint8Array(bytes));
          const page3 = await doc3.getPage(1);
          await new Promise(r => setTimeout(r, 200));
          await attempt("doc3-after-200ms-delay", doc3, false);

          // Attempt 6: call getOperatorList twice back-to-back on the exact same page object.
          const doc4 = await getDocumentProxy(new Uint8Array(bytes));
          const page4 = await doc4.getPage(1);
          const op4a = await page4.getOperatorList();
          console.log(`[doc4-page4-call1] fnArray.length=${op4a.fnArray.length}`);
          const op4b = await page4.getOperatorList();
          console.log(`[doc4-page4-call2-samepage] fnArray.length=${op4b.fnArray.length}`);
          EOF
          deno run --allow-net --allow-read --allow-env /tmp/test.ts
